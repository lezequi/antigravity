<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANTIGRAVITY - Agencia Digital Integral</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #05070A; color: #E8E8E8; }
    .gold-gradient { background: linear-gradient(135deg, #F6E7B2 0%, #C8A75B 50%, #8E6B2F 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-btn { background: linear-gradient(180deg, #DDC181 0%, #A9843F 100%); color: #08101A; }
    .gold-btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .bg-grid { background-image: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px); background-size: 60px 60px; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    .card-hover { transition: all 0.3s; }
    .card-hover:hover { transform: translateY(-5px); border-color: #C8A75B; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Logo
    const Logo = ({ className = "h-12 w-12" }) => (
     <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
       <defs>
         <linearGradient id="antigravity-gold" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
           <stop offset="0%" stopColor="#F6E7B2" />
           <stop offset="50%" stopColor="#C8A75B" />
           <stop offset="100%" stopColor="#8E6B2F" />
         </linearGradient>
       </defs>
       <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" fill="url(#antigravity-gold)" />
       <path d="M50 25 L70 37 L70 63 L50 75 L30 63 L30 37 Z" fill="#05070A" />
       <circle cx="50" cy="50" r="12" fill="url(#antigravity-gold)" />
     </svg>
    );

    // Services
    const services = [
      { icon: "🎬", title: "Producción de Video", desc: "Reels, spots, corporativos, motion graphics" },
      { icon: "🎵", title: "Producción de Audio", desc: "Jingles, podcasts, locución, sound design" },
      { icon: "✂️", title: "Edición", desc: "Corte, color, motion, subtítulos" },
      { icon: "🌐", title: "Desarrollo Web", desc: "Landing pages, sitios, e-commerce" },
      { icon: "📱", title: "Redes Sociales", desc: "Gestión, estrategia, contenido" },
      { icon: "🤖", title: "Automatización IA", desc: "Bots, CRM, dashboards, asistentes" }
    ];

    const ServiceCard = ({ service }) => (
      <div className="card-hover bg-[#0D111A] border border-white/5 rounded-2xl p-6 cursor-pointer">
        <div className="text-4xl mb-4">{service.icon}</div>
        <h3 className="text-xl font-bold text-white mb-2">{service.title}</h3>
        <p className="text-gray-400 text-sm">{service.desc}</p>
      </div>
    );

    // Portfolio
    const portfolio = [
      { category: "Video", title: "Campaña 30s", client: "Marca XYZ" },
      { category: "Audio", title: "Jingle Radial", client: "Cadena NA" },
      { category: "Web", title: "Landing Page", client: "Startup ABC" },
      { category: "Redes", title: "Gestión Instagram", client: "Negocio Local" }
    ];

    // Contact Form
    const ContactForm = () => {
      const [form, setForm] = useState({ nombre: '', email: '', servicio: '', mensaje: '' });
      const [enviado, setEnviado] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setEnviado(true);
        console.log('Lead:', form);
      };

      if (enviado) {
        return (
          <div className="text-center py-12">
            <div className="text-6xl mb-4">🚀</div>
            <h3 className="text-2xl font-bold text-white mb-2">¡Recibido!</h3>
            <p className="text-gray-400">Te contactamos en 24 horas</p>
          </div>
        );
      }

      return (
        <form onSubmit={handleSubmit} className="space-y-4">
          <input type="text" placeholder="Tu nombre" required className="w-full bg-[#0D111A] border border-white/10 rounded-lg px-4 py-3 text-white focus:border-[#C8A75B] outline-none" />
          <input type="email" placeholder="Tu email" required className="w-full bg-[#0D111A] border border-white/10 rounded-lg px-4 py-3 text-white focus:border-[#C8A75B] outline-none" />
          <select className="w-full bg-[#0D111A] border border-white/10 rounded-lg px-4 py-3 text-white focus:border-[#C8A75B] outline-none">
            <option value="">¿Qué servicio necesitás?</option>
            <option value="video">Producción de Video</option>
            <option value="audio">Producción de Audio</option>
            <option value="edicion">Edición</option>
            <option value="web">Desarrollo Web</option>
            <option value="redes">Redes Sociales</option>
            <option value="ia">Automatización IA</option>
          </select>
          <textarea placeholder="Tu mensaje" rows="4" className="w-full bg-[#0D111A] border border-white/10 rounded-lg px-4 py-3 text-white focus:border-[#C8A75B] outline-none resize-none"></textarea>
          <button type="submit" className="w-full py-4 gold-btn font-black text-xs uppercase tracking-[0.4em] rounded-lg">Enviar Consulta →</button>
        </form>
      );
    };

    // App
    const App = () => {
      return (
        <div className="min-h-screen bg-[#05070A] text-[#E8E8E8] font-sans">
          <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full h-[800px] bg-[radial-gradient(circle_at_center,_rgba(200,167,91,0.08)_0%,_transparent_70%)]" />
            <div className="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.01)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.01)_1px,transparent_1px)] bg-[size:60px_60px] opacity-40" />
          </div>

          {/* Nav */}
          <nav className="fixed top-0 w-full z-50 py-6 bg-[#05070A]/80 backdrop-blur-xl border-b border-white/5">
            <div className="max-w-7xl mx-auto px-8 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <Logo className="h-10 w-10" />
                <div>
                  <span className="text-xl font-black tracking-[0.2em] uppercase text-white">ANTIGRAVITY</span>
                  <p className="text-[8px] text-[#C8A75B] tracking-[0.3em] uppercase">Agencia Digital Integral</p>
                </div>
              </div>
              <div className="hidden md:flex items-center gap-8 text-sm font-bold tracking-wider uppercase text-gray-400">
                <a href="#servicios" className="hover:text-[#C8A75B] transition">Servicios</a>
                <a href="#portfolio" className="hover:text-[#C8A75B] transition">Portfolio</a>
                <a href="#proceso" className="hover:text-[#C8A75B] transition">Proceso</a>
                <a href="#contacto" className="px-6 py-2 gold-btn rounded-lg text-[10px]">Contactar</a>
              </div>
            </div>
          </nav>

          {/* Hero */}
          <main className="relative z-10 pt-32 pb-20 px-8">
            <div className="max-w-7xl mx-auto text-center pt-20 pb-16">
              <div className="inline-flex items-center gap-3 px-4 py-2 rounded-full border border-[#C8A75B]/30 bg-[#0B1424]/60 text-[10px] uppercase tracking-[0.3em] text-[#D4B670] font-black mb-8">
                🚀 Transformamos tu presencia digital
              </div>
              <h1 className="text-6xl md:text-8xl font-black leading-tight mb-6">
                <span className="text-white">Hacemos</span><br/>
                <span className="gold-gradient">Brillar</span><br/>
                <span className="text-white">Tu Marca</span>
              </h1>
              <p className="text-xl text-gray-400 max-w-2xl mx-auto mb-10">
                Estudio propio. Todo en un solo lugar. Video, audio, edición, web, redes e IA.
                Precios de estudio sin intermediarios.
              </p>
              <div className="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="#contacto" className="px-10 py-4 gold-btn font-black text-xs uppercase tracking-[0.4em] rounded-lg inline-block">Pedir Presupuesto →</a>
                <a href="#servicios" className="px-10 py-4 border border-white/20 bg-white/5 font-bold text-xs uppercase tracking-[0.4em] rounded-lg inline-block hover:bg-white/10">Ver Servicios</a>
              </div>
            </div>

            {/* Stats */}
            <div className="max-w-4xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 mb-20">
              {[
                { num: "5+", label: "Años experiencia" },
                { num: "200+", label: "Proyectos" },
                { num: "50+", label: "Clientes" },
                { num: "7 días", label: "Entrega" }
              ].map((stat, i) => (
                <div key={i} className="text-center">
                  <div className="text-3xl font-black text-[#C8A75B]">{stat.num}</div>
                  <div className="text-xs uppercase tracking-wider text-gray-500">{stat.label}</div>
                </div>
              ))}
            </div>

            {/* Servicios */}
            <section id="servicios" className="py-20">
              <h2 className="text-4xl font-black text-center mb-4">Nuestros <span className="gold-gradient">Servicios</span></h2>
              <p className="text-gray-400 text-center mb-12 max-w-xl mx-auto">Todo lo que necesitás para destacar en el mundo digital</p>
              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
                {services.map((s, i) => <ServiceCard key={i} service={s} />)}
              </div>
            </section>

            {/* Portfolio */}
            <section id="portfolio" className="py-20">
              <h2 className="text-4xl font-black text-center mb-4">Nuestro <span className="gold-gradient">Trabajo</span></h2>
              <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto">
                {portfolio.map((p, i) => (
                  <div key={i} className="bg-[#0D111A] border border-white/5 rounded-2xl p-6">
                    <div className="text-xs text-[#C8A75B] uppercase tracking-wider mb-2">{p.category}</div>
                    <h3 className="text-lg font-bold text-white mb-1">{p.title}</h3>
                    <p className="text-gray-500 text-sm">{p.client}</p>
                  </div>
                ))}
              </div>
            </section>

            {/* Proceso */}
            <section id="proceso" className="py-20">
              <h2 className="text-4xl font-black text-center mb-12">Cómo <span className="gold-gradient">Trabajamos</span></h2>
              <div className="max-w-4xl mx-auto grid md:grid-cols-3 gap-8">
                {[
                  { num: "01", title: "Brief", desc: "Entendemos tu visión y objetivos" },
                  { num: "02", title: "Producción", desc: "Creamos el contenido" },
                  { num: "03", title: "Entrega", desc: "Formatos optimizados" }
                ].map((step, i) => (
                  <div key={i} className="text-center">
                    <div className="text-5xl font-black text-[#C8A75B]/20 mb-4">{step.num}</div>
                    <h3 className="text-xl font-bold text-white mb-2">{step.title}</h3>
                    <p className="text-gray-400">{step.desc}</p>
                  </div>
                ))}
              </div>
            </section>

            {/* Contacto */}
            <section id="contacto" className="py-20">
              <div className="max-w-2xl mx-auto bg-[#0D111A] border border-white/5 rounded-3xl p-8 md:p-12">
                <h2 className="text-3xl font-black text-center mb-2">Hablemos</h2>
                <p className="text-gray-400 text-center mb-8">Contanos qué necesitás y te mandamos presupuesto</p>
                <ContactForm />
              </div>
            </section>

            {/* Footer */}
            <footer className="py-12 border-t border-white/5 text-center">
              <div className="flex items-center justify-center gap-3 mb-4">
                <Logo className="h-8 w-8" />
                <span className="text-lg font-black tracking-[0.2em] uppercase text-white">ANTIGRAVITY</span>
              </div>
              <p className="text-gray-500 text-sm">📧 hola@antigravity.com | 📱 +54 9 11 XXXX-XXXX</p>
              <p className="text-gray-600 text-xs mt-4">© 2026 Antigravity. Todos los derechos reservados.</p>
            </footer>
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
