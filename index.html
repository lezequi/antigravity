<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANTIGRAVITY - Agencia Digital Integral</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0a0a12; color: #fff; }
    .neon-cyan { color: #00f0ff; }
    .neon-green { color: #39ff14; }
    .glow-cyan { box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
    .glow-green { box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
    .bg-grid { background-image: linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px); background-size: 40px 40px; }
    .card-cyber { background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%); }
    .card-cyber:hover { background: rgba(0, 240, 255, 0.1); border-color: #00f0ff; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .animate-float { animation: float 4s ease-in-out infinite; }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); } 50% { box-shadow: 0 0 40px rgba(0, 240, 255, 0.6); } }
    .pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }
    @keyframes rocket-fly { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }
  </style>
</head>
<body class="bg-grid min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Logo
    const Logo = () => (
      <svg viewBox="0 0 100 100" fill="none" className="h-12 w-12">
        <path d="M50 10 L85 75 L15 75 Z" stroke="#00f0ff" strokeWidth="3" fill="none" />
        <path d="M50 30 L70 65 L30 65 Z" fill="#00f0ff" opacity="0.3" />
        <circle cx="50" cy="48" r="8" fill="#00f0ff" />
      </svg>
    );

    // Rocket
    const Rocket = () => (
      <svg className="h-8 w-8 animate-float" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L8 8H2L6 12L4 20L12 22L20 20L18 12L22 8H16L12 2Z" fill="#00f0ff" />
        <path d="M12 22L14 18H10L12 22Z" fill="#39ff14" />
      </svg>
    );

    // Services
    const services = [
      { icon: "🎬", title: "PRODUCCIÓN DE VIDEO", desc: "Reels, spots, corporativos, motion graphics", stats: "150+ videos" },
      { icon: "🎵", title: "PRODUCCIÓN DE AUDIO", desc: "Jingles, podcasts, locución, sound design", stats: "80+ proyectos" },
      { icon: "✂️", title: "EDICIÓN", desc: "Corte, color, motion, subtítulos", stats: "200+ horas" },
      { icon: "🌐", title: "DESARROLLO WEB", desc: "Landing pages, sitios, e-commerce", stats: "45+ sitios" },
      { icon: "📱", title: "REDES SOCIALES", desc: "Gestión, estrategia, contenido", stats: "25+ cuentas" },
      { icon: "🤖", title: "AUTOMATIZACIÓN IA", desc: "Bots, CRM, dashboards, asistentes", stats: "15+ automatizaciones" }
    ];

    // Stats
    const stats = [
      { num: "247+", label: "PROYECTOS", color: "cyan" },
      { num: "68+", label: "CLIENTES", color: "cyan" },
      { num: "5+", label: "AÑOS", color: "cyan" },
      { num: "100%", label: "ENTREGAS", color: "green" }
    ];

    // Process Steps
    const process = [
      { num: "01", title: "BRIEF", desc: "Tu visión" },
      { num: "02", title: "ESTRATEGIA", desc: "Planificación" },
      { num: "03", title: "PRODUCCIÓN", desc: "Creación" },
      { num: "04", title: "ENTREGA", desc: "Resultado" }
    ];

    // Contact Form
    const ContactForm = () => {
      const [enviado, setEnviado] = useState(false);
      return enviado ? (
        <div className="text-center py-12">
          <Rocket />
          <h3 className="text-2xl font-bold text-white mt-4">¡REcibido!</h3>
          <p className="text-gray-400">Te contactamos en menos de 24h</p>
        </div>
      ) : (
        <form onSubmit={(e) => { e.preventDefault(); setEnviado(true); }} className="space-y-4">
          <input type="text" placeholder="Tu nombre" required className="w-full bg-black/50 border border-cyan-500/30 rounded-lg px-4 py-3 text-white focus:border-cyan-400 outline-none" />
          <input type="email" placeholder="Tu email" required className="w-full bg-black/50 border border-cyan-500/30 rounded-lg px-4 py-3 text-white focus:border-cyan-400 outline-none" />
          <select className="w-full bg-black/50 border border-cyan-500/30 rounded-lg px-4 py-3 text-white focus:border-cyan-400 outline-none">
            <option value="">¿Qué servicio necesitás?</option>
            <option value="video">Producción de Video</option>
            <option value="audio">Producción de Audio</option>
            <option value="web">Desarrollo Web</option>
            <option value="redes">Redes Sociales</option>
            <option value="ia">Automatización IA</option>
          </select>
          <textarea placeholder="Tu mensaje" rows="4" className="w-full bg-black/50 border border-cyan-500/30 rounded-lg px-4 py-3 text-white focus:border-cyan-400 outline-none resize-none"></textarea>
          <button type="submit" className="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 font-black text-xs uppercase tracking-[0.4em] rounded-lg hover:opacity-90 pulse-glow">ENVIAR CONSULTA →</button>
        </form>
      );
    };

    // App
    const App = () => (
      <div className="min-h-screen bg-[#0a0a12] text-white font-sans">
        {/* Nav */}
        <nav className="fixed top-0 w-full z-50 py-4 bg-black/80 backdrop-blur-xl border-b border-cyan-500/20">
          <div className="max-w-7xl mx-auto px-8 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <Logo />
              <div>
                <span className="text-xl font-black tracking-[0.15em] uppercase neon-cyan">ANTIGRAVITY</span>
                <p className="text-[8px] text-gray-400 tracking-[0.2em]">AGENCIA DIGITAL INTEGRAL</p>
              </div>
            </div>
            <div className="hidden md:flex items-center gap-8 text-sm font-bold tracking-wider uppercase text-gray-400">
              <a href="#servicios" className="hover:text-cyan-400 transition">Servicios</a>
              <a href="#proceso" className="hover:text-cyan-400 transition">Proceso</a>
              <a href="#contacto" className="px-6 py-2 bg-cyan-500 text-black font-bold text-xs rounded-lg">Contactar</a>
            </div>
          </div>
        </nav>

        {/* Hero */}
        <main className="relative z-10 pt-32 pb-20 px-8">
          <div className="max-w-7xl mx-auto">
            {/* Header with Rocket */}
            <div className="text-center mb-16">
              <div className="flex items-center justify-center gap-4 mb-6">
                <span className="text-4xl">🚀</span>
                <h1 className="text-5xl md:text-7xl font-black">
                  <span className="text-white">DESAFIAMOS</span><br/>
                  <span className="neon-cyan">LA GRAVEDAD</span><br/>
                  <span className="text-white">TÚ ASCIENDES</span>
                </h1>
                <span className="text-4xl animate-float">🚀</span>
              </div>
              <p className="text-xl text-gray-400 max-w-2xl mx-auto">
                Estudio propio. Todo en un solo lugar. Video, audio, edición, web, redes e IA.
              </p>
            </div>

            {/* Stats */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto mb-20">
              {stats.map((s, i) => (
                <div key={i} className={`text-center p-6 rounded-xl ${s.color === 'green' ? 'bg-green-500/10 border border-green-500/30' : 'bg-cyan-500/10 border border-cyan-500/30'}`}>
                  <div className={`text-3xl font-black ${s.color === 'green' ? 'neon-green' : 'neon-cyan'}`}>{s.num}</div>
                  <div className="text-xs uppercase tracking-wider text-gray-400">{s.label}</div>
                </div>
              ))}
            </div>

            {/* Services */}
            <section id="servicios" className="py-16">
              <h2 className="text-4xl font-black text-center mb-12">
                <span className="neon-cyan">SERVICIOS</span>
              </h2>
              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                {services.map((s, i) => (
                  <div key={i} className="card-cyber p-6 rounded-xl">
                    <div className="text-3xl mb-3">{s.icon}</div>
                    <h3 className="text-lg font-bold neon-cyan mb-2">{s.title}</h3>
                    <p className="text-gray-400 text-sm mb-3">{s.desc}</p>
                    <div className="text-xs text-cyan-300 font-bold">{s.stats}</div>
                  </div>
                ))}
              </div>
            </section>

            {/* Process - Flow */}
            <section id="proceso" className="py-16">
              <h2 className="text-4xl font-black text-center mb-12">
                <span className="neon-cyan">FLUJO DE PROCESO</span>
              </h2>
              <div className="relative max-w-2xl mx-auto">
                {/* Central Line */}
                <div className="absolute left-1/2 top-0 bottom-0 w-1 bg-gradient-to-b from-cyan-500 via-cyan-300 to-green-500 transform -translate-x-1/2"></div>
                
                {/* Rocket on line */}
                <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10">
                  <Rocket />
                </div>

                {process.map((p, i) => (
                  <div key={i} className={`flex items-center mb-8 ${i % 2 === 0 ? 'justify-start' : 'justify-end'}`}>
                    <div className={`w-5/12 p-4 rounded-xl ${i % 2 === 0 ? 'text-right' : 'text-left'} card-cyber`}>
                      <div className="text-3xl font-black text-cyan-500/30">{p.num}</div>
                      <div className="text-lg font-bold text-white">{p.title}</div>
                      <div className="text-sm text-gray-400">{p.desc}</div>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* Advantages */}
            <div className="max-w-3xl mx-auto mb-16 p-8 rounded-2xl bg-green-500/10 border border-green-500/30">
              <h3 className="text-xl font-bold text-center mb-6 neon-green">LA VENTAJA ANTIGRAVITY</h3>
              <div className="grid md:grid-cols-3 gap-6 text-center">
                <div>
                  <div className="text-2xl mb-2">♾️</div>
                  <div className="font-bold">REVISIONES</div>
                  <div className="text-sm text-gray-400">ILIMITADAS</div>
                </div>
                <div>
                  <div className="text-2xl mb-2">⚡</div>
                  <div className="font-bold">ENTREGA</div>
                  <div className="text-sm text-gray-400">5-7 DÍAS</div>
                </div>
                <div>
                  <div className="text-2xl mb-2">🎯</div>
                  <div className="font-bold">CONTROL</div>
                  <div className="text-sm text-gray-400">CREATIVO TOTAL</div>
                </div>
              </div>
            </div>

            {/* Contact */}
            <section id="contacto" className="py-16">
              <div className="max-w-xl mx-auto bg-black/50 border border-cyan-500/30 rounded-3xl p-8">
                <h2 className="text-3xl font-black text-center mb-2">HABLEMOS</h2>
                <p className="text-gray-400 text-center mb-8">Tu próximo proyecto está a un mensaje de distancia</p>
                <ContactForm />
              </div>
            </section>

            {/* Footer */}
            <footer className="py-8 border-t border-cyan-500/20 text-center">
              <div className="flex items-center justify-center gap-3 mb-4">
                <Logo />
                <span className="text-lg font-black tracking-[0.15em] uppercase neon-cyan">ANTIGRAVITY</span>
              </div>
              <p className="text-gray-500 text-sm">📧 [TU EMAIL] | 📱 [TU TELÉFONO]</p>
              <p className="text-gray-600 text-xs mt-4">© 2026 ANTIGRAVITY. Todos los derechos reservados.</p>
            </footer>
          </div>
        </main>
      </div>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
