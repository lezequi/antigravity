<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANTIGRAVITY - Agencia Digital Integral</title>
  <meta name="description" content="Estudio propio. Video, audio, edición, web, redes e IA. Todo en un solo lugar.">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: #000; color: #fff; overflow-x: hidden; }
    :root { --cyan: #00f0ff; --cyan-dark: #00b8c4; --green: #39ff14; --purple: #b026ff; }
    
    /* Animated Background */
    .bg-animated {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .bg-animated::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(176, 38, 255, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 40% 40%, rgba(57, 255, 20, 0.04) 0%, transparent 30%);
      animation: bgMove 30s linear infinite;
    }
    @keyframes bgMove {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
    }
    
    /* Typography */
    .font-display { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'Space Mono', monospace; }
    
    /* Glow Effects */
    .glow-cyan { box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), 0 0 60px rgba(0, 240, 255, 0.2); }
    .glow-green { box-shadow: 0 0 30px rgba(57, 255, 20, 0.4); }
    .text-glow-cyan { text-shadow: 0 0 20px rgba(0, 240, 255, 0.8), 0 0 40px rgba(0, 240, 255, 0.4); }
    .text-glow-green { text-shadow: 0 0 20px rgba(57, 255, 20, 0.8); }
    
    /* Cards */
    .card-premium {
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-premium:hover {
      background: linear-gradient(135deg, rgba(0,240,255,0.1) 0%, rgba(176,38,255,0.05) 100%);
      border-color: rgba(0, 240, 255, 0.3);
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 240, 255, 0.15);
    }
    
    /* Buttons */
    .btn-primary {
      background: linear-gradient(135deg, #00f0ff 0%, #00b8c4 100%);
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.2) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.4);
    }
    
    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
      50% { box-shadow: 0 0 40px rgba(0, 240, 255, 0.6), 0 0 60px rgba(0, 240, 255, 0.3); }
    }
    @keyframes rocket-float {
      0%, 100% { transform: translateY(0) rotate(-45deg); }
      50% { transform: translateY(-15px) rotate(-45deg); }
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-float { animation: float 4s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }
    .animate-rocket { animation: rocket-float 3s ease-in-out infinite; }
    .animate-gradient {
      background-size: 200% 200%;
      animation: gradient-shift 8s ease infinite;
    }
    
    /* Process Line */
    .process-line {
      background: linear-gradient(180deg, transparent, #00f0ff, transparent);
      width: 2px;
    }
    .process-dot {
      width: 16px;
      height: 16px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 20px #00f0ff;
    }
    
    /* Form */
    .input-premium {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .input-premium:focus {
      background: rgba(0,240,255,0.05);
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
      outline: none;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Components
    const Logo = () => (
      <svg viewBox="0 0 100 100" fill="none" className="h-14 w-14">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#00f0ff" />
            <stop offset="100%" stopColor="#b026ff" />
          </linearGradient>
        </defs>
        <path d="M50 5 L90 75 L10 75 Z" stroke="url(#logoGrad)" strokeWidth="3" fill="none" />
        <path d="M50 25 L75 65 L25 65 Z" fill="url(#logoGrad)" opacity="0.3" />
        <circle cx="50" cy="45" r="10" fill="url(#logoGrad)" />
      </svg>
    );

    const Rocket = () => (
      <svg className="h-12 w-12 animate-rocket" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L8 8H2L6 12L4 20L12 22L20 20L18 12L22 8H16L12 2Z" fill="url(#logoGrad)" />
        <path d="M12 22L14 18H10L12 22Z" fill="#39ff14" />
      </svg>
    );

    const Stats = () => {
      const [projects, setProjects] = useState(247);
      const [clients, setClients] = useState(68);
      
      useEffect(() => {
        const interval = setInterval(() => {
          setProjects(p => p + Math.floor(Math.random() * 2));
          setClients(c => c + (Math.random() > 0.8 ? 1 : 0));
        }, 4000);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto">
          {[
            { num: projects, label: 'PROYECTOS', suffix: '+', color: 'cyan' },
            { num: clients, label: 'CLIENTES', suffix: '+', color: 'cyan' },
            { num: 5, label: 'AÑOS', suffix: '+', color: 'cyan' },
            { num: 100, label: 'ENTREGAS', suffix: '%', color: 'green' }
          ].map((stat, i) => (
            <div key={i} className={`card-premium p-6 rounded-2xl text-center ${stat.color === 'green' ? 'border-green-500/30 bg-green-500/5' : ''}`}>
              <div className={`text-4xl md:text-5xl font-black mb-2 ${stat.color === 'green' ? 'text-[#39ff14] text-glow-green' : 'text-[#00f0ff] text-glow-cyan'}`}>
                {stat.num}{stat.suffix}
              </div>
              <div className="text-xs tracking-[0.3em] text-gray-400 font-mono">{stat.label}</div>
            </div>
          ))}
        </div>
      );
    };

    const Services = () => {
      const services = [
        { icon: '🎬', title: 'PRODUCCIÓN DE VIDEO', desc: 'Reels, spots, corporativos, motion graphics', stats: '150+ videos', color: 'from-cyan-500 to-blue-500' },
        { icon: '🎵', title: 'PRODUCCIÓN DE AUDIO', desc: 'Jingles, podcasts, locución, sound design', stats: '80+ proyectos', color: 'from-purple-500 to-pink-500' },
        { icon: '✂️', title: 'EDICIÓN PROFESIONAL', desc: 'Corte, color, motion, subtítulos', stats: '200+ horas', color: 'from-orange-500 to-red-500' },
        { icon: '🌐', title: 'DESARROLLO WEB', desc: 'Landing pages, sitios, e-commerce', stats: '45+ sitios', color: 'from-green-500 to-cyan-500' },
        { icon: '📱', title: 'REDES SOCIALES', desc: 'Gestión, estrategia, contenido', stats: '25+ cuentas', color: 'from-pink-500 to-rose-500' },
        { icon: '🤖', title: 'AUTOMATIZACIÓN IA', desc: 'Bots, CRM, dashboards, asistentes', stats: '15+ automatizaciones', color: 'from-cyan-500 to-purple-500' }
      ];
      
      return (
        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
          {services.map((s, i) => (
            <div key={i} className="card-premium p-8 rounded-2xl cursor-pointer group">
              <div className="flex items-start justify-between mb-4">
                <span className="text-4xl">{s.icon}</span>
                <span className="text-xs font-mono text-[#00f0ff] opacity-60">{s.stats}</span>
              </div>
              <h3 className="text-xl font-bold mb-3 bg-gradient-to-r bg-clip-text text-transparent animate-gradient bg-300% bg-[length:200%_200%] bg-[image:var(--gradient)]" style={{'--gradient': s.color}}>
                {s.title}
              </h3>
              <p className="text-gray-400 text-sm">{s.desc}</p>
            </div>
          ))}
        </div>
      );
    };

    const Process = () => {
      const steps = [
        { num: '01', title: 'BRIEF', desc: 'Tu visión', icon: '💡' },
        { num: '02', title: 'ESTRATEGIA', desc: 'Planificación', icon: '📋' },
        { num: '03', title: 'PRODUCCIÓN', desc: 'Creación', icon: '⚡' },
        { num: '04', title: 'ENTREGA', desc: 'Resultado', icon: '🎯' }
      ];
      
      return (
        <div className="relative max-w-4xl mx-auto">
          <div className="absolute left-1/2 top-0 bottom-0 w-0.5 process-line transform -translate-x-1/2"></div>
          <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2">
            <Rocket />
          </div>
          <div className="space-y-12">
            {steps.map((step, i) => (
              <div key={i} className={`flex items-center ${i % 2 === 0 ? 'justify-start' : 'justify-end'}`}>
                <div className={`w-5/12 ${i % 2 === 0 ? 'text-right pr-8' : 'text-left pl-8'}`}>
                  <div className="card-premium p-6 rounded-2xl inline-block">
                    <div className="flex items-center gap-4 mb-2">
                      <span className="text-2xl">{step.icon}</span>
                      <span className="text-4xl font-black text-[#00f0ff]/30 font-mono">{step.num}</span>
                    </div>
                    <h3 className="text-lg font-bold text-white">{step.title}</h3>
                    <p className="text-gray-400 text-sm">{step.desc}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const Advantages = () => (
      <div className="max-w-5xl mx-auto grid md:grid-cols-3 gap-6">
        {[
          { icon: '♾️', title: 'REVISIONES', subtitle: 'ILIMITADAS', desc: 'Hasta que quede perfecto' },
          { icon: '⚡', title: 'ENTREGA', subtitle: '5-7 DÍAS', desc: 'Rápido y eficiente' },
          { icon: '🎯', title: 'CONTROL', subtitle: 'CREATIVO TOTAL', desc: 'Vos decis, nosotros ejecutamos' }
        ].map((adv, i) => (
          <div key={i} className="card-premium p-8 rounded-2xl text-center border-green-500/20 bg-green-500/5">
            <div className="text-5xl mb-4">{adv.icon}</div>
            <div className="text-2xl font-black text-[#39ff14] mb-1">{adv.title}</div>
            <div className="text-sm font-mono text-[#39ff14]/70 mb-3">{adv.subtitle}</div>
            <p className="text-gray-400 text-sm">{adv.desc}</p>
          </div>
        ))}
      </div>
    );

    const ContactForm = () => {
      const [sent, setSent] = useState(false);
      
      return sent ? (
        <div className="text-center py-12">
          <Rocket />
          <h3 className="text-3xl font-black mt-6 text-[#00f0ff]">¡MISIÓN RECIBIDA!</h3>
          <p className="text-gray-400 mt-2">Te contactamos en menos de 24 horas</p>
        </div>
      ) : (
        <form onSubmit={(e) => { e.preventDefault(); setSent(true); }} className="space-y-5">
          <input type="text" placeholder="Tu nombre" required className="w-full px-5 py-4 rounded-xl input-premium text-white" />
          <input type="email" placeholder="Tu email" required className="w-full px-5 py-4 rounded-xl input-premium text-white" />
          <select className="w-full px-5 py-4 rounded-xl input-premium text-white">
            <option value="">¿Qué servicio necesitás?</option>
            <option value="video">Producción de Video</option>
            <option value="audio">Producción de Audio</option>
            <option value="web">Desarrollo Web</option>
            <option value="redes">Redes Sociales</option>
            <option value="ia">Automatización IA</option>
          </select>
          <textarea placeholder="Tu mensaje" rows="4" className="w-full px-5 py-4 rounded-xl input-premium text-white resize-none"></textarea>
          <button type="submit" className="w-full py-5 rounded-xl btn-primary font-black text-sm tracking-[0.2em] uppercase">
            ENVIAR MISIÓN →
          </button>
        </form>
      );
    };

    const App = () => (
      <div className="min-h-screen relative">
        {/* Animated Background */}
        <div className="bg-animated">
          <div className="grid-overlay"></div>
        </div>

        {/* Navigation */}
        <nav className="fixed top-0 w-full z-50 py-5 bg-black/80 backdrop-blur-xl border-b border-white/5">
          <div className="max-w-7xl mx-auto px-8 flex items-center justify-between">
            <div className="flex items-center gap-4">
              <Logo />
              <div>
                <div className="text-xl font-black tracking-[0.15em] bg-gradient-to-r from-[#00f0ff] to-[#b026ff] bg-clip-text text-transparent">ANTIGRAVITY</div>
                <div className="text-[9px] tracking-[0.3em] text-gray-500 font-mono">AGENCIA DIGITAL INTEGRAL</div>
              </div>
            </div>
            <div className="hidden md:flex items-center gap-10 text-sm font-medium tracking-wider text-gray-400">
              <a href="#servicios" className="hover:text-[#00f0ff] transition">SERVICIOS</a>
              <a href="#proceso" className="hover:text-[#00f0ff] transition">PROCESO</a>
              <a href="#contacto" className="px-6 py-3 rounded-xl btn-primary font-bold text-xs tracking-[0.1em]">CONTACTAR</a>
            </div>
          </div>
        </nav>

        {/* Main Content */}
        <main className="relative z-10 pt-32 pb-20">
          {/* Hero */}
          <section className="max-w-7xl mx-auto px-8 mb-24">
            <div className="text-center mb-12">
              <div className="inline-flex items-center gap-3 px-5 py-2 rounded-full border border-[#00f0ff]/30 bg-[#00f0ff]/5 mb-8">
                <span className="text-2xl">🚀</span>
                <span className="text-sm font-mono text-[#00f0ff] tracking-wider">DESAFIAMOS LA GRAVEDAD</span>
              </div>
              <h1 className="text-6xl md:text-8xl font-black leading-tight mb-6">
                <span className="text-white">TU MARCA</span><br/>
                <span className="bg-gradient-to-r from-[#00f0ff] via-[#b026ff] to-[#39ff14] bg-clip-text text-transparent text-glow-cyan">ASCIENDE</span>
              </h1>
              <p className="text-xl text-gray-400 max-w-2xl mx-auto mb-10">
                Estudio propio. Todo en un solo lugar. 
                <span className="text-white font-bold"> Video, audio, edición, web, redes e IA.</span>
              </p>
            </div>
            <Stats />
          </section>

          {/* Services */}
          <section id="servicios" className="py-20">
            <h2 className="text-5xl font-black text-center mb-4">
              <span className="text-white">NUESTROS</span>{' '}
              <span className="bg-gradient-to-r from-[#00f0ff] to-[#b026ff] bg-clip-text text-transparent">SERVICIOS</span>
            </h2>
            <p className="text-gray-400 text-center mb-16 max-w-xl mx-auto">Todo lo que necesitás para dominar el universo digital</p>
            <Services />
          </section>

          {/* Process */}
          <section id="proceso" className="py-20">
            <h2 className="text-5xl font-black text-center mb-20">
              <span className="text-white">FLUJO DE</span>{' '}
              <span className="text-[#00f0ff] text-glow-cyan">PROCESO</span>
            </h2>
            <Process />
          </section>

          {/* Advantages */}
          <section className="py-20">
            <h2 className="text-4xl font-black text-center mb-12">
              <span className="text-[#39ff14] text-glow-green">LA VENTAJA</span>{' '}
              <span className="text-white">ANTIGRAVITY</span>
            </h2>
            <Advantages />
          </section>

          {/* Contact */}
          <section id="contacto" className="py-20">
            <div className="max-w-xl mx-auto card-premium p-10 rounded-3xl">
              <h2 className="text-4xl font-black text-center mb-2">HABLEMOS</h2>
              <p className="text-gray-400 text-center mb-8">Tu próximo proyecto está a un mensaje de distancia</p>
              <ContactForm />
            </div>
          </section>

          {/* Footer */}
          <footer className="py-12 border-t border-white/5">
            <div className="max-w-7xl mx-auto px-8 text-center">
              <div className="flex items-center justify-center gap-4 mb-6">
                <Logo />
                <span className="text-xl font-black tracking-[0.15em] text-[#00f0ff]">ANTIGRAVITY</span>
              </div>
              <p className="text-gray-500 text-sm mb-2">📧 [TU EMAIL] &nbsp;|&nbsp; 📱 [TU TELÉFONO]</p>
              <p className="text-gray-600 text-xs">© 2026 ANTIGRAVITY. Todos los derechos reservados.</p>
            </div>
          </footer>
        </main>
      </div>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
